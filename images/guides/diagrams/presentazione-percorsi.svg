<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">Presentazione: il menu non è il percorso</title>
<desc id="desc">Percorsi di presentazione: copie blt, flip composto dal DWM, Independent Flip e piano hardware MPO. Un overlay può cambiare il percorso secondo le condizioni.</desc>
<style>[fill="#4ade80"]{fill:#ff6600}[stroke="#4ade80"]{stroke:#ff6600}</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8896a7" stroke-width="2"/></marker>
<marker id="back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#8896a7" stroke-width="2"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="640" rx="0" fill="#0b0f14" stroke="none" stroke-width="2"/>
<text x="40" y="45" font-size="24" fill="#4ade80" text-anchor="start" font-weight="400">PRIME BUILD / SCHEMA ORIGINALE</text>
<text x="40" y="94" font-size="36" fill="#e5e7eb" text-anchor="start" font-weight="700">Presentazione: il menu non è il percorso</text>
<path d="M 40 118 L 1160 118" fill="none" stroke="#8896a7" stroke-width="3"/>
<text x="40" y="193" font-size="24" fill="#4ade80" text-anchor="start" font-weight="700">Blt / copie</text>
<rect x="325" y="150" width="315" height="75" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="482.5" y="179.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Copie verso</text>
<text x="482.5" y="211.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">superfici desktop</text>
<rect x="725" y="150" width="315" height="75" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="882.5" y="179.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">DWM</text>
<text x="882.5" y="211.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">composizione</text>
<path d="M 640 188 L 725 188" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1040 188 L 1150 188" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="288" font-size="24" fill="#4ade80" text-anchor="start" font-weight="700">Composed Flip</text>
<rect x="325" y="245" width="315" height="75" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="482.5" y="274.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Buffer condivisi</text>
<text x="482.5" y="306.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">flip model</text>
<rect x="725" y="245" width="315" height="75" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="882.5" y="274.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">DWM</text>
<text x="882.5" y="306.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">composizione</text>
<path d="M 640 283 L 725 283" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1040 283 L 1150 283" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="383" font-size="24" fill="#4ade80" text-anchor="start" font-weight="700">Independent Flip</text>
<rect x="325" y="340" width="315" height="75" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="482.5" y="369.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Buffer condivisi</text>
<text x="482.5" y="401.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">condizioni idonee</text>
<rect x="725" y="340" width="315" height="75" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="882.5" y="369.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Scanout diretto</text>
<text x="882.5" y="401.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">DWM gestisce</text>
<path d="M 640 378 L 725 378" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1040 378 L 1150 378" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="478" font-size="24" fill="#4ade80" text-anchor="start" font-weight="700">MPO / piani HW</text>
<rect x="325" y="435" width="315" height="75" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="482.5" y="464.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Piano del gioco</text>
<text x="482.5" y="496.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">+ altri contenuti</text>
<rect x="725" y="435" width="315" height="75" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="882.5" y="464.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Display engine</text>
<text x="882.5" y="496.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">combina piani</text>
<path d="M 640 473 L 725 473" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1040 473 L 1150 473" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="534" font-size="24" fill="#e5e7eb" text-anchor="start" font-weight="400">Uscita → display. Overlay / notifiche possono cambiare il percorso.</text>
<path d="M 40 542 L 1160 542" fill="none" stroke="#8896a7" stroke-width="3"/>
<text x="40" y="578" font-size="24" fill="#b5c0ce" text-anchor="start" font-weight="400">Schema condizionale, non misura: nessun bypass permanente garantito.</text>
<text x="40" y="610" font-size="24" fill="#b5c0ce" text-anchor="start" font-weight="400">DWM resta responsabile della gestione; MPO e HAGS sono funzioni diverse.</text>
</svg>
