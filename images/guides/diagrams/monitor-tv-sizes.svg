<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>Monitor o TV: la diagonale non è l'unico dato</title><desc>Misure indicative dello schermo, senza cornice. Scala comune: 1 cm = 2,8 px.</desc><defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#b16b30" stroke-opacity=".085"/></pattern><radialGradient id="glow"><stop stop-color="#742a05" stop-opacity=".28"/><stop offset="1" stop-color="#090909" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="900" fill="#090909"/><rect width="1200" height="900" fill="url(#grid)"/><ellipse cx="220" cy="160" rx="520" ry="350" fill="url(#glow)"/><g font-family="Arial, sans-serif"><text x="60.0" y="47.0" font-size="17" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1.5">PRIME BUILD / LAB NOTES</text><text x="60.0" y="106.0" font-size="36" fill="#f4f2ed" text-anchor="start" font-weight="normal" opacity="1">Monitor o TV: la diagonale non è l'unico dato</text><text x="60.0" y="139.0" font-size="17" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">Misure indicative dello schermo, senza cornice. Scala comune: 1 cm = 2,8 px.</text><path d="M60 160L1140 160" fill="none" stroke="#58331d" stroke-width="1"/><text x="60.0" y="190.0" font-size="16" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">Piatti e curvi, 16:9, 21:9 e 32:9: il formato cambia area, distanza e uso. Le TV sono in grigio.</text><rect x="70.0" y="250.0" width="198.4" height="111.6" rx="4" fill="#151515" stroke="#ff6900" stroke-width="2" opacity="1"/><text x="80.0" y="270.0" font-size="13" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">MONITOR</text><path d="M80.0 351.6 L258.4 351.6" fill="none" stroke="#a9a8a5" stroke-width="1.2" opacity=".5"/><text x="70.0" y="420.0" font-size="19" fill="#f4f2ed" text-anchor="start" font-weight="bold" opacity="1">32" · 16:9</text><text x="70.0" y="443.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">70,8 × 39,9 cm</text><text x="70.0" y="466.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">piatto · 80–100 cm</text><text x="70.0" y="489.0" font-size="14" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1">4K 120–240 Hz</text><rect x="330.0" y="260.0" width="222.3" height="95.3" rx="4" fill="#151515" stroke="#ff6900" stroke-width="2" opacity="1"/><text x="340.0" y="280.0" font-size="13" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">MONITOR</text><path d="M340.0 345.3 Q441.1 363.3 542.3 345.3" fill="none" stroke="#ff6900" stroke-width="2" opacity=".85"/><path d="M494.3 284.0 Q516.3 266.0 538.3 284.0" fill="none" stroke="#ff6900" stroke-width="2" stroke-linecap="round"/><circle cx="516.3" cy="294.0" r="3.2" fill="#ff6900"/><path d="M511.3 300.0 L516.3 294.0 L521.3 300.0" fill="none" stroke="#ff6900" stroke-width="1.3" opacity=".8"/><text x="330.0" y="420.0" font-size="19" fill="#f4f2ed" text-anchor="start" font-weight="bold" opacity="1">34" · 21:9</text><text x="330.0" y="443.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">79,4 × 34,0 cm</text><text x="330.0" y="466.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">curvo · 80–100 cm</text><text x="330.0" y="489.0" font-size="14" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1">144–240 Hz</text><rect x="640.0" y="225.0" width="260.3" height="146.4" rx="4" fill="#151515" stroke="#8b8a87" stroke-width="2" opacity="1"/><text x="650.0" y="245.0" font-size="13" fill="#8b8a87" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">TV</text><path d="M650.0 361.4 L890.3 361.4" fill="none" stroke="#a9a8a5" stroke-width="1.2" opacity=".5"/><text x="640.0" y="420.0" font-size="19" fill="#f4f2ed" text-anchor="start" font-weight="bold" opacity="1">42" · 16:9 · TV 4K</text><text x="640.0" y="443.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">93,0 × 52,3 cm</text><text x="640.0" y="466.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">1,0–1,5 m · 120–165 Hz</text><text x="640.0" y="489.0" font-size="14" fill="#8b8a87" text-anchor="start" font-weight="bold" opacity="1">HDMI 2.1 · VRR</text><rect x="90.0" y="560.0" width="297.5" height="167.4" rx="4" fill="#151515" stroke="#8b8a87" stroke-width="2" opacity="1"/><text x="100.0" y="580.0" font-size="13" fill="#8b8a87" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">TV</text><path d="M100.0 717.4 L377.5 717.4" fill="none" stroke="#a9a8a5" stroke-width="1.2" opacity=".5"/><text x="90.0" y="745.0" font-size="19" fill="#f4f2ed" text-anchor="start" font-weight="bold" opacity="1">48" · 16:9 · TV 4K</text><text x="90.0" y="768.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">106,2 × 59,7 cm</text><text x="90.0" y="791.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">1,2–1,8 m · 120–165 Hz</text><text x="90.0" y="814.0" font-size="14" fill="#8b8a87" text-anchor="start" font-weight="bold" opacity="1">HDMI 2.1 · VRR</text><rect x="500.0" y="620.0" width="335.5" height="94.4" rx="4" fill="#151515" stroke="#ff6900" stroke-width="2" opacity="1"/><text x="510.0" y="640.0" font-size="13" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">MONITOR</text><path d="M510.0 704.4 Q667.7 722.4 825.5 704.4" fill="none" stroke="#ff6900" stroke-width="2" opacity=".85"/><path d="M777.5 644.0 Q799.5 626.0 821.5 644.0" fill="none" stroke="#ff6900" stroke-width="2" stroke-linecap="round"/><circle cx="799.5" cy="654.0" r="3.2" fill="#ff6900"/><path d="M794.5 660.0 L799.5 654.0 L804.5 660.0" fill="none" stroke="#ff6900" stroke-width="1.3" opacity=".8"/><text x="500.0" y="745.0" font-size="19" fill="#f4f2ed" text-anchor="start" font-weight="bold" opacity="1">49" · 32:9</text><text x="500.0" y="768.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">119,8 × 33,7 cm</text><text x="500.0" y="791.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">curvo · 80–120 cm</text><text x="500.0" y="814.0" font-size="14" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1">144–240 Hz</text><text x="60.0" y="845.0" font-size="13" fill="#a9a8a5" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="0.6">ARANCIO = monitor · GRIGIO = TV · arco = curvo</text><text x="60.0" y="865.0" font-size="13" fill="#a9a8a5" text-anchor="start" font-weight="bold" opacity="1">20 cm</text><path d="M120 860H176" stroke="#ff6900" stroke-width="2"/><path d="M120 855V865M176 855V865" stroke="#ff6900" stroke-width="2"/><path d="M60 852L1140 852" fill="none" stroke="#58331d" stroke-width="1"/><text x="60.0" y="878.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">Misure stimate dalla diagonale e dal formato, senza cornice. Distanze, curvature e refresh sono punti di partenza, non regole universali.</text><path d="M0 899H1200" stroke="#ff6900" stroke-width="2"/></g></svg>