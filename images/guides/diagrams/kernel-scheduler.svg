<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">Processi, scheduler e interrupt</title>
<desc id="desc">Processo e thread in user mode richiedono servizi al kernel; scheduler assegna esecuzione ai thread pronti. Dispositivo segnala un interrupt, ISR fa lavoro breve e DPC può proseguire lavoro differito. Non è una misura DPC né un preset di priorità.</desc>
<style>[fill="#4ade80"]{fill:#ff6600}[stroke="#4ade80"]{stroke:#ff6600}</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8896a7" stroke-width="2"/></marker>
<marker id="back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#8896a7" stroke-width="2"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="640" rx="0" fill="#0b0f14" stroke="none" stroke-width="2"/>
<text x="40" y="45" font-size="24" fill="#4ade80" text-anchor="start" font-weight="400">PRIME BUILD / SCHEMA ORIGINALE</text>
<text x="40" y="94" font-size="36" fill="#e5e7eb" text-anchor="start" font-weight="700">Processi, scheduler e interrupt</text>
<path d="M 40 118 L 1160 118" fill="none" stroke="#8896a7" stroke-width="3"/>
<text x="40" y="160" font-size="26" fill="#4ade80" text-anchor="start" font-weight="400">USER MODE</text>
<rect x="40" y="185" width="310" height="96" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="195.0" y="225.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Processo A</text>
<text x="195.0" y="257.15999999999997" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">thread pronti</text>
<rect x="390" y="185" width="310" height="96" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="545.0" y="225.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Processo B</text>
<text x="545.0" y="257.15999999999997" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">thread pronti</text>
<rect x="820" y="185" width="340" height="96" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="990.0" y="225.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">CPU: esegue thread</text>
<text x="990.0" y="257.15999999999997" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">selezionato</text>
<path d="M 40 316 L 1160 316" fill="none" stroke="#8896a7" stroke-width="3" stroke-dasharray="9 7"/>
<text x="40" y="350" font-size="26" fill="#4ade80" text-anchor="start" font-weight="400">KERNEL MODE</text>
<rect x="40" y="374" width="310" height="106" rx="12" fill="#131c26" stroke="#4ade80" stroke-width="2"/>
<text x="195.0" y="419.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Scheduler</text>
<text x="195.0" y="451.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">sceglie thread pronto</text>
<path d="M 195 281 V 374" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 545 281 V 338 H 365 V 427 H 350" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 350 427 H 380 V 360 H 775 V 232 H 820" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="420" y="374" width="270" height="106" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="555.0" y="419.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">ISR breve</text>
<text x="555.0" y="451.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">gestisce interrupt</text>
<rect x="820" y="374" width="340" height="106" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="990.0" y="419.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">DPC: lavoro differito</text>
<text x="990.0" y="451.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">quando necessario</text>
<path d="M 690 427 L 820 427" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="420" y="521" font-size="24" fill="#e5e7eb" text-anchor="start" font-weight="400">Dispositivo → interrupt → ISR → eventuale DPC</text>
<path d="M 40 542 L 1160 542" fill="none" stroke="#8896a7" stroke-width="3"/>
<text x="40" y="578" font-size="24" fill="#b5c0ce" text-anchor="start" font-weight="400">Schema logico: interrupt e DPC possono sottrarre esecuzione ai thread.</text>
<text x="40" y="610" font-size="24" fill="#b5c0ce" text-anchor="start" font-weight="400">Priorità non crea potenza CPU; diagramma senza misure o tweak consigliati.</text>
</svg>
