<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Due riferimenti audio separati</title><desc>Profilo piatto, EQ OFF e associazione rimossa non sono equivalenti.</desc><defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#b16b30" stroke-opacity=".085"/></pattern><radialGradient id="glow"><stop stop-color="#742a05" stop-opacity=".28"/><stop offset="1" stop-color="#090909" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="600" fill="#090909"/><rect width="1200" height="600" fill="url(#grid)"/><ellipse cx="220" cy="160" rx="520" ry="350" fill="url(#glow)"/><g font-family="Arial, sans-serif"><text x="60" y="47" font-size="17" fill="#ff6900" text-anchor="start">PRIME BUILD / LAB NOTES</text><text x="60" y="106" font-size="36" fill="#f4f2ed" text-anchor="start">Due riferimenti audio separati</text><path d="M60 137L1140 137" fill="none" stroke="#58331d" stroke-width="1"/><text x="75" y="205" font-size="18" fill="#ff6900" text-anchor="start">01</text><g transform="translate(322 278) scale(0.85)" fill="none" stroke="#ff6900" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-29-43v86M0-43v86M29-43v86"/><rect x="-37" y="-22" width="16" height="17" fill="#10100f"/><rect x="-8" y="13" width="16" height="17" fill="#10100f"/><rect x="21" y="-33" width="16" height="17" fill="#10100f"/></g><text x="322" y="365" font-size="27" fill="#f4f2ed" text-anchor="middle">No APO</text><text x="322" y="424" font-size="23" fill="#a9a8a5" text-anchor="middle">Equalizer APO fuori dal percorso</text><path d="M588 195L588 465" fill="none" stroke="#38312b" stroke-width="1"/><text x="615" y="205" font-size="18" fill="#ff6900" text-anchor="start">02</text><g transform="translate(862 278) scale(0.85)" fill="none" stroke="#ff6900" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-29-43v86M0-43v86M29-43v86"/><rect x="-37" y