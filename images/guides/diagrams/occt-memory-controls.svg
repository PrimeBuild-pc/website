<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="728" viewBox="0 0 1200 728"><title>OCCT / Memory</title><desc>La quantità allocata non coincide con la RAM totale; nessun valore è un preset universale.</desc><defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#b16b30" stroke-opacity=".085"/></pattern><radialGradient id="glow"><stop stop-color="#742a05" stop-opacity=".28"/><stop offset="1" stop-color="#090909" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="728" fill="#090909"/><rect width="1200" height="728" fill="url(#grid)"/><ellipse cx="220" cy="160" rx="520" ry="350" fill="url(#glow)"/><g font-family="Arial,sans-serif"><text x="55" y="40" font-size="17" fill="#ff6900" text-anchor="start">PRIME BUILD / MAPPA DEI CONTROLLI</text><text x="55" y="103" font-size="42" fill="#f4f2ed" text-anchor="start">OCCT / Memory</text><text x="55" y="143" font-size="22" fill="#a9a8a5" text-anchor="start">Schema di lettura della guida · non è una schermata del programma</text><path d="M55 188L1145 188" fill="none" stroke="#4c3120" stroke-width="1"/><text x="55" y="230" font-size="20" fill="#ff6900" text-anchor="start">01</text><text x="105" y="232" font-size="27" fill="#f4f2ed" text-anchor="start">Test type</text><text x="480" y="231" font-size="27" fill="#f4f2ed" text-anchor="start">Legacy · Presets · Custom</text><text x="480" y="269" font-size="22" fill="#a9a8a5" text-anchor="start">Annotare sequenza e versione.</text><path d="M55 310L1145 310" fill="none" stroke="#4c3120" stroke-width="1"/><text x="55" y="352" font-size="20" fill="#ff6900" text-anchor="start">02</text><text x="105" y="354" font-size="27" fill="#f4f2ed" text-anchor="start">Memory</text><text x="480" y="353" font-size="27" fill="#f4f2ed" text-anchor="start">% della memoria libera · MiB</text><text x="480" y="391" font-size="22" fill="#a9a8a5" text-anchor="start">Lasciare margine al sistema.</text><path d="M55 432L1145 432" fill="none" stroke="#4c3120" stroke-width="1"/><text x="55" y="474" font-size="20" fill="#ff6900" text-anchor="start">03</text><text x="105" y="476" font-size="27" fill="#f4f2ed" text-anchor="start">Instruction set</text><text x="480" y="475" font-size="27" fill="#f4f2ed" text-anchor="start">SSE · AVX · Auto</text><text x="480" y="513" font-size="22" fill="#a9a8a5" text-anchor="start">Auto non significa carico leggero.</text><path d="M55 554L1145 554" fill="none" stroke="#4c3120" stroke-width="1"/><text x="55" y="596" font-size="20" fill="#ff6900" text-anchor="start">04</text><text x="105" y="598" font-size="27" fill="#f4f2ed" text-anchor="start">Threads</text><text x="480" y="597" font-size="27" fill="#f4f2ed" text-anchor="start">Auto · numero fisso</text><text x="480" y="635" font-size="22" fill="#a9a8a5" text-anchor="start">Registrare il numero effettivo.</text><text x="55" y="694" font-size="20" fill="#a9a8a5" text-anchor="start">La quantità allocata non coincide con la RAM totale; nessun valore è un preset universale.</text></g></svg>