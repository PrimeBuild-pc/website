<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">CPU e GPU: lavoro sovrapposto</title>
<desc id="desc">Pipeline CPU e GPU su corsie parallele: preparazione, possibile coda, rendering e presentazione. Il lavoro sul frame successivo può sovrapporsi al rendering precedente.</desc>
<style>[fill="#4ade80"]{fill:#ff6600}[stroke="#4ade80"]{stroke:#ff6600}</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8896a7" stroke-width="2"/></marker>
<marker id="back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#8896a7" stroke-width="2"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="640" rx="0" fill="#0b0f14" stroke="none" stroke-width="2"/>
<text x="40" y="45" font-size="24" fill="#4ade80" text-anchor="start" font-weight="400">PRIME BUILD / SCHEMA ORIGINALE</text>
<text x="40" y="94" font-size="36" fill="#e5e7eb" text-anchor="start" font-weight="700">CPU e GPU: lavoro sovrapposto</text>
<path d="M 40 118 L 1160 118" fill="none" stroke="#8896a7" stroke-width="3"/>
<text x="40" y="163" font-size="24" fill="#4ade80" text-anchor="start" font-weight="400">ORDINE CONCETTUALE → nessuna scala temporale</text>
<text x="40" y="238" font-size="28" fill="#4ade80" text-anchor="start" font-weight="700">CPU</text>
<text x="40" y="396" font-size="28" fill="#4ade80" text-anchor="start" font-weight="700">GPU</text>
<rect x="145" y="195" width="280" height="94" rx="12" fill="#131c26" stroke="#4ade80" stroke-width="2"/>
<text x="285.0" y="234.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Input / simulazione</text>
<text x="285.0" y="266.15999999999997" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">comandi del frame N</text>
<rect x="470" y="195" width="330" height="94" rx="12" fill="#131c26" stroke="#4ade80" stroke-width="2"/>
<text x="635.0" y="234.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Preparazione N+1</text>
<text x="635.0" y="266.15999999999997" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">mentre GPU lavora</text>
<path d="M 425 242 L 470 242" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="470" y="346" width="245" height="104" rx="12" fill="#131c26" stroke="#4ade80" stroke-width="2"/>
<text x="592.5" y="390.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Rendering</text>
<text x="592.5" y="422.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">frame N</text>
<rect x="775" y="346" width="220" height="104" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="885.0" y="390.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Presentazione</text>
<text x="885.0" y="422.16" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">e scanout</text>
<path d="M 425 264 H 445 V 398 H 470" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="167" y="325" font-size="24" fill="#e5e7eb" text-anchor="start" font-weight="400">Possibile coda</text>
<path d="M 715 398 L 775 398" fill="none" stroke="#8896a7" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="470" y="482" width="330" height="47" rx="12" fill="#131c26" stroke="#8896a7" stroke-width="2"/>
<text x="635.0" y="513.66" font-size="24" fill="#e5e7eb" text-anchor="middle" font-weight="400">Sovrapposizione possibile</text>
<path d="M 625 289 L 625 346" fill="none" stroke="#8896a7" stroke-width="3" stroke-dasharray="9 7"/>
<text x="830" y="495" font-size="24" fill="#e5e7eb" text-anchor="start" font-weight="400">N+1 non è input</text>
<text x="830" y="527" font-size="24" fill="#e5e7eb" text-anchor="start" font-weight="400">letto al display</text>
<path d="M 40 542 L 1160 542" fill="none" stroke="#8896a7" stroke-width="3"/>
<text x="40" y="578" font-size="24" fill="#b5c0ce" text-anchor="start" font-weight="400">Corsie e lunghezze non sono tempi misurati né millisecondi.</text>
<text x="40" y="610" font-size="24" fill="#b5c0ce" text-anchor="start" font-weight="400">CPU + GPU non dà automaticamente frametime o latenza input → fotone.</text>
</svg>
