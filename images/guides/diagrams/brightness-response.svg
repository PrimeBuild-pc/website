<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><g font-family="Arial, sans-serif"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b16b30" stroke-opacity=".08"/></pattern><radialGradient id="glow"><stop stop-color="#742a05" stop-opacity=".25"/><stop offset="1" stop-color="#090909" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="600" fill="#090909"/><rect width="1200" height="600" fill="url(#g)"/><ellipse cx="180" cy="120" rx="520" ry="340" fill="url(#glow)"/><text x="60" y="47" font-size="17" fill="#ff6900" text-anchor="start" font-weight="400">PRIME BUILD / VISUAL NOTES</text><text x="60" y="106" font-size="36" fill="#f4f2ed" text-anchor="start" font-weight="400">BFI: più nitidezza, meno luminosità</text><text x="60" y="140" font-size="20" fill="#a9a8a5" text-anchor="start" font-weight="400">Esempio didattico a 240 Hz; i valori reali dipendono dal monitor.</text><path d="M60 164L1140 164" fill="none" stroke="#58331d" stroke-width="1"/><text x="70" y="210" font-size="24" fill="#f4f2ed" text-anchor="start" font-weight="650">100% duty</text><rect x="230" y="182" width="640" height="44" rx="0" fill="#8d8780" stroke="none"/><text x="900" y="206" font-size="19" fill="#a9a8a5" text-anchor="start" font-weight="400">100% luminosità</text><text x="900" y="230" font-size="19" fill="#ffad73" text-anchor="start" font-weight="400">4,17 ms MPRT</text><text x="70" y="305" font-size="24" fill="#f4f2ed" text-anchor="start" font-weight="650">50% duty</text><rect x="230" y="277" width="320" height="44" rx="0" fill="#ff6900" stroke="none"/><text x="900" y="301" font-size="19" fill="#a9a8a5" text-anchor="start" font-weight="400">~50% luminosità</text><text x="900" y="325" font-size="19" fill="#ffad73" text-anchor="start" font-weight="400">~2,08 ms MPRT</text><text x="70" y="400" font-size="24" fill="#f4f2ed" text-anchor="start" font-weight="650">25% duty</text><rect x="230" y="372" width="160" height="44" rx="0" fill="#ff6900" stroke="none"/><text x="900" y="396" font-size="19" fill="#a9a8a5" text-anchor="start" font-weight="400">~25% luminosità</text><text x="900" y="420" font-size="19" fill="#ffad73" text-anchor="start" font-weight="400">~1,04 ms MPRT</text><path d="M230 520L1000 520" fill="none" stroke="#2b2926" stroke-width="1"/><text x="230" y="548" font-size="16" fill="#a9a8a5" text-anchor="start" font-weight="400">Luminosità relativa</text><path d="M60 532L1140 532" fill="none" stroke="#58331d" stroke-width="1"/><text x="60" y="566" font-size="18" fill="#a9a8a5" text-anchor="start" font-weight="400">Ridurre il duty cycle accorcia la persistence ma riduce la luce disponibile: non è un aumento di GtG.</text><path d="M0 599H1200" stroke="#ff6900" stroke-width="2"/></g></svg>