<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>Competitivo e immersivo: due geometrie</title><desc>Misure indicative dello schermo, senza cornice. Scala comune: 1 cm = 2,8 px.</desc><defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#b16b30" stroke-opacity=".085"/></pattern><radialGradient id="glow"><stop stop-color="#742a05" stop-opacity=".28"/><stop offset="1" stop-color="#090909" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="800" fill="#090909"/><rect width="1200" height="800" fill="url(#grid)"/><ellipse cx="220" cy="160" rx="520" ry="350" fill="url(#glow)"/><g font-family="Arial, sans-serif"><text x="60.0" y="47.0" font-size="17" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1.5">PRIME BUILD / LAB NOTES</text><text x="60.0" y="106.0" font-size="36" fill="#f4f2ed" text-anchor="start" font-weight="normal" opacity="1">Competitivo e immersivo: due geometrie</text><text x="60.0" y="139.0" font-size="17" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">Misure indicative dello schermo, senza cornice. Scala comune: 1 cm = 2,8 px.</text><path d="M60 160L1140 160" fill="none" stroke="#58331d" stroke-width="1"/><text x="60.0" y="190.0" font-size="16" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">Confronto in scala tra un setup competitivo e uno immersivo. Le distanze sono punti di partenza, non regole.</text><rect x="60.0" y="210.0" width="510.0" height="500.0" rx="8" fill="#0d0d0d" stroke="#292725" stroke-width="1" opacity="1"/><rect x="630.0" y="210.0" width="510.0" height="500.0" rx="8" fill="#0d0d0d" stroke="#292725" stroke-width="1" opacity="1"/><text x="84.0" y="242.0" font-size="18" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">COMPETITIVO</text><text x="84.0" y="266.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">24–27" · 1080p/1440p · piatto</text><text x="654.0" y="242.0" font-size="18" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">IMMERSIVO</text><text x="654.0" y="266.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">34–42" · 21:9/16:9 · curvo o TV</text><rect x="90.0" y="320.0" width="149.4" height="84.0" rx="4" fill="#151515" stroke="#ff6900" stroke-width="2" opacity="1"/><text x="100.0" y="340.0" font-size="13" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">24,1"</text><path d="M100.0 394.0 L229.4 394.0" fill="none" stroke="#a9a8a5" stroke-width="1.2" opacity=".5"/><text x="90.0" y="442.0" font-size="18" fill="#f4f2ed" text-anchor="start" font-weight="bold" opacity="1">24,1" · 16:9</text><text x="90.0" y="465.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">53,3 × 30,0 cm</text><text x="90.0" y="488.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">60–80 cm · 240–600 Hz</text><rect x="300.0" y="308.0" width="167.4" height="94.1" rx="4" fill="#151515" stroke="#ff6900" stroke-width="2" opacity="1"/><text x="310.0" y="328.0" font-size="13" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">27"</text><path d="M310.0 392.1 L457.4 392.1" fill="none" stroke="#a9a8a5" stroke-width="1.2" opacity=".5"/><rect x="320.9" y="308.0" width="125.5" height="94.1" rx="2" fill="rgba(255,105,0,0.10)" stroke="#ff6900" stroke-width="1.5" opacity="1" stroke-dasharray="5 4"/><text x="383.7" y="353.1" font-size="14" fill="#ff6900" text-anchor="middle" font-weight="bold" opacity="1">4:3</text><text x="383.7" y="370.1" font-size="11" fill="#ff6900" text-anchor="middle" font-weight="normal" opacity="1">stretch</text><text x="300.0" y="442.0" font-size="18" fill="#f4f2ed" text-anchor="start" font-weight="bold" opacity="1">27" · 16:9</text><text x="300.0" y="465.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">59,8 × 33,6 cm</text><text x="300.0" y="488.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">70–90 cm · 240–500 Hz</text><rect x="90.0" y="548.0" width="190.0" height="54.0" rx="6" fill="#101010" stroke="#292725" stroke-width="1" opacity="1"/><text x="104.0" y="571.0" font-size="17" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1">60–80 cm</text><text x="104.0" y="590.0" font-size="12" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">distanza indicativa</text><rect x="300.0" y="548.0" width="200.0" height="54.0" rx="6" fill="#101010" stroke="#292725" stroke-width="1" opacity="1"/><text x="314.0" y="571.0" font-size="17" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1">240–600 Hz</text><text x="314.0" y="590.0" font-size="12" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">refresh consigliato</text><text x="90.0" y="648.0" font-size="13" fill="#a9a8a5" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">PIATTO</text><text x="90.0" y="670.0" font-size="13" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">La cornice non è inclusa; la distanza dipende da vista e postura.</text><text x="90.0" y="690.0" font-size="13" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">Il 4:3 è mostrato come area attiva dentro un pannello 16:9.</text><rect x="660.0" y="310.0" width="222.3" height="95.3" rx="4" fill="#151515" stroke="#ff6900" stroke-width="2" opacity="1"/><text x="670.0" y="330.0" font-size="13" fill="#ff6900" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">34"</text><path d="M670.0 395.3 Q771.1 413.3 872.3 395.3" fill="none" stroke="#ff6900" stroke-width="2" opacity=".85"/><path d="M824.3 334.0 Q846.3 316.0 868.3 334.0" fill="none" stroke="#ff6900" stroke-width="2" stroke-linecap="round"/><circle cx="846.3" cy="344.0" r="3.2" fill="#ff6900"/><path d="M841.3 350.0 L846.3 344.0 L851.3 350.0" fill="none" stroke="#ff6900" stroke-width="1.3" opacity=".8"/><text x="660.0" y="442.0" font-size="18" fill="#f4f2ed" text-anchor="start" font-weight="bold" opacity="1">34" · 21:9</text><text x="660.0" y="465.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">79,4 × 34,0 cm</text><text x="660.0" y="488.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">80–100 cm · 144–240 Hz</text><rect x="660.0" y="490.0" width="260.3" height="146.4" rx="4" fill="#151515" stroke="#8b8a87" stroke-width="2" opacity="1"/><text x="670.0" y="510.0" font-size="13" fill="#8b8a87" text-anchor="start" font-weight="bold" opacity="1" letter-spacing="1">42" TV</text><path d="M670.0 626.4 L910.3 626.4" fill="none" stroke="#a9a8a5" stroke-width="1.2" opacity=".5"/><text x="660.0" y="655.0" font-size="18" fill="#f4f2ed" text-anchor="start" font-weight="bold" opacity="1">42" · 16:9 · TV 4K</text><text x="660.0" y="678.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">93,0 × 52,3 cm</text><text x="660.0" y="701.0" font-size="14" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">1,0–1,5 m · 120–165 Hz</text><text x="60.0" y="752.0" font-size="13" fill="#a9a8a5" text-anchor="start" font-weight="bold" opacity="1">20 cm</text><path d="M120 747H176" stroke="#ff6900" stroke-width="2"/><path d="M120 742V752M176 742V752" stroke="#ff6900" stroke-width="2"/><path d="M60 752L1140 752" fill="none" stroke="#58331d" stroke-width="1"/><text x="60.0" y="778.0" font-size="15" fill="#a9a8a5" text-anchor="start" font-weight="normal" opacity="1">Le misure sono stimate dalla diagonale e dal formato, senza cornice. Distanze e refresh sono indicativi.</text><path d="M0 799H1200" stroke="#ff6900" stroke-width="2"/></g></svg>