<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><g font-family="Arial, sans-serif"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b16b30" stroke-opacity=".08"/></pattern><radialGradient id="glow"><stop stop-color="#742a05" stop-opacity=".25"/><stop offset="1" stop-color="#090909" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="600" fill="#090909"/><rect width="1200" height="600" fill="url(#g)"/><ellipse cx="180" cy="120" rx="520" ry="340" fill="url(#glow)"/><text x="60" y="47" font-size="17" fill="#ff6900" text-anchor="start" font-weight="400">PRIME BUILD / VISUAL NOTES</text><text x="60" y="106" font-size="36" fill="#f4f2ed" text-anchor="start" font-weight="400">Dal gesto all’occhio: la catena non è un solo numero</text><text x="60" y="140" font-size="20" fill="#a9a8a5" text-anchor="start" font-weight="400">Schema concettuale; i tempi si sommano solo con misure coerenti.</text><path d="M60 164L1140 164" fill="none" stroke="#58331d" stroke-width="1"/><rect x="270" y="235" width="120" height="110" rx="8" fill="#101011" stroke="#4a4744"/><text x="330" y="280" font-size="22" fill="#f4f2ed" text-anchor="middle" font-weight="650">Gesto</text><text x="330" y="310" font-size="16" fill="#a9a8a5" text-anchor="middle" font-weight="400">mouse / pad</text><path d="M390 290L410 290" fill="none" stroke="#ff6900" stroke-width="2"/><rect x="410" y="235" width="120" height="110" rx="8" fill="#101011" stroke="#4a4744"/><text x="470" y="280" font-size="22" fill="#f4f2ed" text-anchor="middle" font-weight="650">Gioco</text><text x="470" y="310" font-size="16" fill="#a9a8a5" text-anchor="middle" font-weight="400">simulazione</text><path d="M530 290L550 290" fill="none" stroke="#ff6900" stroke-width="2"/><rect x="550" y="235" width="120" height="110" rx="8" fill="#101011" stroke="#4a4744"/><text x="610" y="280" font-size="22" fill="#f4f2ed" text-anchor="middle" font-weight="650">GPU</text><text x="610" y="310" font-size="16" fill="#a9a8a5" text-anchor="middle" font-weight="400">render</text><path d="M670 290L690 290" fill="none" stroke="#ff6900" stroke-width="2"/><rect x="690" y="235" width="120" height="110" rx="8" fill="#101011" stroke="#4a4744"/><text x="750" y="280" font-size="22" fill="#f4f2ed" text-anchor="middle" font-weight="650">Cavo</text><text x="750" y="310" font-size="16" fill="#a9a8a5" text-anchor="middle" font-weight="400">segnale</text><path d="M810 290L830 290" fill="none" stroke="#ff6900" stroke-width="2"/><rect x="830" y="235" width="120" height="110" rx="8" fill="#101011" stroke="#4a4744"/><text x="890" y="280" font-size="22" fill="#f4f2ed" text-anchor="middle" font-weight="650">Monitor</text><text x="890" y="310" font-size="16" fill="#a9a8a5" text-anchor="middle" font-weight="400">pixel</text><path d="M950 290L970 290" fill="none" stroke="#ff6900" stroke-width="2"/><rect x="970" y="235" width="120" height="110" rx="8" fill="#101011" stroke="#4a4744"/><text x="1030" y="280" font-size="22" fill="#f4f2ed" text-anchor="middle" font-weight="650">Occhio</text><text x="1030" y="310" font-size="16" fill="#a9a8a5" text-anchor="middle" font-weight="400">percezione</text><text x="70" y="422" font-size="18" fill="#ff6900" text-anchor="start" font-weight="400">Frame time</text><text x="70" y="452" font-size="18" fill="#ff6900" text-anchor="start" font-weight="400">Refresh e scanout</text><text x="70" y="482" font-size="18" fill="#ff6900" text-anchor="start" font-weight="400">Pixel response</text><path d="M300 440L1120 440" fill="none" stroke="#2b2926" stroke-width="1"/><path d="M230 470L1120 470" fill="none" stroke="#2b2926" stroke-width="1"/><path d="M230 500L1120 500" fill="none" stroke="#2b2926" stroke-width="1"/><path d="M330 440L330 500" fill="none" stroke="#ffad73" stroke-width="3"/><path d="M470 440L470 500" fill="none" stroke="#ffad73" stroke-width="3"/><path d="M610 440L610 500" fill="none" stroke="#ffad73" stroke-width="3"/><path d="M750 440L750 500" fill="none" stroke="#ffad73" stroke-width="3"/><path d="M890 440L890 500" fill="none" stroke="#ffad73" stroke-width="3"/><path d="M1030 440L1030 500" fill="none" stroke="#ffad73" stroke-width="3"/><path d="M60 532L1140 532" fill="none" stroke="#58331d" stroke-width="1"/><text x="60" y="566" font-size="18" fill="#a9a8a5" text-anchor="start" font-weight="400">«0,03 ms» può descrivere il pixel; la latenza percepita include gioco, GPU, cavo e scansione.</text><path d="M0 599H1200" stroke="#ff6900" stroke-width="2"/></g></svg>