<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Frame renderizzati e immagini generate</title><desc>Schema concettuale: immagini aggiunte ≠ nuovi campionamenti input.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#ff8b3d"/></marker></defs><rect width="1200" height="600" rx="20" fill="#11151a"/><g font-family="Arial, sans-serif"><text x="50" y="48" font-size="17" fill="#ffb07a" text-anchor="start">PRIME BUILD / SCHEMA ILLUSTRATIVO ORIGINALE</text><text x="50" y="102" font-size="32" fill="#eee" text-anchor="start">Frame renderizzati e immagini generate</text><path d="M309.5,290 L322.5,290" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="235" width="247.5" height="110" rx="12" fill="#1e2329" stroke="#59616d"/><text x="178.75" y="275" font-size="21" fill="#eee" text-anchor="middle">Render N</text><path d="M582,290 L595,290" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="327.5" y="235" width="247.5" height="110" rx="12" fill="#81451e" stroke="#59616d"/><text x="451.25" y="275" font-size="21" fill="#eee" text-anchor="middle">Generato</text><path d="M854.5,290 L867.5,290" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" y="235" width="247.5" height="110" rx="12" fill="#1e2329" stroke="#59616d"/><text x="723.75" y="275" font-size="21" fill="#eee" text-anchor="middle">Render N+1</text><rect x="872.5" y="235" width="247.5" height="110" rx="12" fill="#81451e" stroke="#59616d"/><text x="996.25" y="275" font-size="21" fill="#eee" text-anchor="middle">Generato</text><text x="50" y="550" font-size="20" fill="#c4cad2" text-anchor="start">Schema concettuale: immagini aggiunte ≠ nuovi campionamenti input.</text></g></svg>