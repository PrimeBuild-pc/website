<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Intervalli nominali a cadenza costante</title><desc>1000 / FPS = ms per intervallo; non è la latenza input → fotone.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#ff8b3d"/></marker></defs><rect width="1200" height="600" rx="20" fill="#11151a"/><g font-family="Arial, sans-serif"><text x="50" y="48" font-size="17" fill="#ffb07a" text-anchor="start">PRIME BUILD / SCHEMA ILLUSTRATIVO ORIGINALE</text><text x="50" y="102" font-size="32" fill="#eee" text-anchor="start">Intervalli nominali a cadenza costante</text><text x="50" y="198" font-size="22" fill="#eee" text-anchor="start">100 FPS</text><rect x="225" y="174" width="700" height="32" rx="12" fill="#81451e" stroke="#59616d"/><text x="945" y="198" font-size="20" fill="#eee" text-anchor="start">10 ms</text><text x="50" y="255" font-size="22" fill="#eee" text-anchor="start">200 FPS</text><rect x="225" y="231" width="350" height="32" rx="12" fill="#81451e" stroke="#59616d"/><text x="945" y="255" font-size="20" fill="#eee" text-anchor="start">5 ms</text><text x="50" y="312" font-size="22" fill="#eee" text-anchor="start">240 FPS</text><rect x="225" y="288" width="291.669" height="32" rx="12" fill="#81451e" stroke="#59616d"/><text x="945" y="312" font-size="20" fill="#eee" text-anchor="start">4,167 ms</text><text x="50" y="550" font-size="20" fill="#c4cad2" text-anchor="start">1000 / FPS = ms per intervallo; non è la latenza input → fotone.</text></g></svg>