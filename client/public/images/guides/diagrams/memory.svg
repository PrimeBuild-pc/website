<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>RAM, commit e working set</title><desc>Grandezza e ruolo sono distinti; nessuna quantità è misurata.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#ff8b3d"/></marker></defs><rect width="1200" height="600" rx="20" fill="#11151a"/><g font-family="Arial, sans-serif"><text x="50" y="48" font-size="17" fill="#ffb07a" text-anchor="start">PRIME BUILD / SCHEMA ILLUSTRATIVO ORIGINALE</text><text x="50" y="102" font-size="32" fill="#eee" text-anchor="start">RAM, commit e working set</text><rect x="50" y="155" width="1100" height="72" rx="12" fill="#1e2329" stroke="#59616d"/><text x="75" y="190" font-size="23" fill="#ffb07a" text-anchor="start">RAM fisica</text><text x="380" y="190" font-size="22" fill="#eee" text-anchor="start">Memoria installata</text><rect x="50" y="235" width="1100" height="72" rx="12" fill="#151a20" stroke="#59616d"/><text x="75" y="270" font-size="23" fill="#ffb07a" text-anchor="start">Working set</text><text x="380" y="270" font-size="22" fill="#eee" text-anchor="start">Pagine residenti</text><rect x="50" y="315" width="1100" height="72" rx="12" fill="#1e2329" stroke="#59616d"/><text x="75" y="350" font-size="23" fill="#ffb07a" text-anchor="start">Commit</text><text x="380" y="350" font-size="22" fill="#eee" text-anchor="start">Memoria promessa</text><rect x="50" y="395" width="1100" height="72" rx="12" fill="#151a20" stroke="#59616d"/><text x="75" y="430" font-size="23" fill="#ffb07a" text-anchor="start">Pagefile</text><text x="380" y="430" font-size="22" fill="#eee" text-anchor="start">Sostegno al commit</text><text x="50" y="550" font-size="20" fill="#c4cad2" text-anchor="start">Grandezza e ruolo sono distinti; nessuna quantità è misurata.</text></g></svg>