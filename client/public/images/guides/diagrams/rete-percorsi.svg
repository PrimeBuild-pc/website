<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">Dal provider alla casa: tre accessi</title>
<desc id="desc">FTTH, FTTC e FWA su tre righe bidirezionali: rete ISP e distribuzione, apparato di accesso in casa, WAN e router. Sotto, LAN Ethernet e Wi-Fi distinte. Oltre l’ISP: peering o transito, rete del servizio e server; il ritorno può differire.</desc>
