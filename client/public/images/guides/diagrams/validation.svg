<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Una modifica, più prove</title><desc>Stesse condizioni; conservare anche esiti inconclusivi e regressioni.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#ff8b3d"/></marker></defs><rect width="1200" height="600" rx="20" fill="#11151a"/><g font-family="Arial, sans-serif"><text x="50" y="48" font-size="17" fill="#ffb07a" text-anchor="start">PRIME BUILD / SCHEMA ILLUSTRATIVO ORIGINALE</text><text x="50" y="102" font-size="32" fill="#eee" text-anchor="start">Una modifica, più prove</text><path d="M257,290 L270,290" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="235" width="195" height="110" rx="12" fill="#1e2329" stroke="#59616d"/><text x="152.5" y="275" font-size="21" fill="#eee" text-anchor="middle">A: riferimento</text><path d="M477,290 L490,290" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="275" y="235" width="195" height="110" rx="12" fill="#1e2329" stroke="#59616d"/><text x="372.5" y="275" font-size="21" fill="#eee" text-anchor="middle">B: una modifica</text><path d="M697,290 L710,290" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="495" y="235" width="195" height="110" rx="12" fill="#1e2329" stroke="#59616d"/><text x="592.5" y="275" font-size="21" fill="#eee" text-anchor="middle">A: ritorno</text><path d="M917,290 L930,290" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="715" y="235" width="195" height="110" rx="12" fill="#1e2329" stroke="#59616d"/><text x="812.5" y="275" font-size="21" fill="#eee" text-anchor="middle">Ripetizioni</text><rect x="935" y="235" width="195" height="110" rx="12" fill="#1e2329" stroke="#59616d"/><text x="1032.5" y="275" font-size="21" fill="#eee" text-anchor="middle">Decisione</text><text x="50" y="550" font-size="20" fill="#c4cad2" text-anchor="start">Stesse condizioni; conservare anche esiti inconclusivi e regressioni.</text></g></svg>