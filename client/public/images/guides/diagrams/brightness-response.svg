 x="-37" y="-22" width="16" height="17" fill="#10100f"/><rect x="-8" y="13" width="16" height="17" fill="#10100f"/><rect x="21" y="-33" width="16" height="17" fill="#10100f"/></g><text x="592" y="365" font-size="27" fill="#f4f2ed" text-anchor="middle">BFI/MPRT</text><text x="592" y="424" font-size="23" fill="#a9a8a5" text-anchor="middle">Duty cycle più corto</text><path d="M768 195L768 465" fill="none" stroke="#38312b" stroke-width="1"/><text x="795" y="205" font-size="18" fill="#ff6900" text-anchor="start">03</text><g transform="translate(952 278) scale(0.85)" fill="none" stroke="#ff6900" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-29-43v86M0-43v86M29-43v86"/><rect x="-37" y="-22" width="16" height="17" fill="#10100f"/><rect x="-8" y="13" width="16" height="17" fill="#10100f"/><rect x="21" y="-33" width="16" height="17" fill="#10100f"/></g><text x="952" y="365" font-size="27" fill="#f4f2ed" text-anchor="middle">Overdrive</text><text x="952" y="424" font-size="23" fill="#a9a8a5" text-anchor="middle">Transizione più rapida</text><path d="M60 518L1140 518" fill="none" stroke="#58331d" stroke-width="1"/><text x="60" y="552" font-size="20" fill="#a9a8a5" text-anchor="start">La luminosità non è la manopola del GtG; il legame passa da BFI, ABL e percezione.</text></g><path d="M0 599H1200" stroke="#ff6900" stroke-width="2"/></svg>