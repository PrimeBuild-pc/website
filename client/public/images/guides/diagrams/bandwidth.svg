<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Che cosa richiede banda al collegamento</title><desc>Il requisito riguarda il segnale attivo e le capacità della catena.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#ff8b3d"/></marker></defs><rect width="1200" height="600" rx="20" fill="#11151a"/><g font-family="Arial, sans-serif"><text x="50" y="48" font-size="17" fill="#ffb07a" text-anchor="start">PRIME BUILD / SCHEMA ILLUSTRATIVO ORIGINALE</text><text x="50" y="102" font-size="32" fill="#eee" text-anchor="start">Che cosa richiede banda al collegamento</text><path d="M210,215 L600,298" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="175" width="340" height="72" rx="12" fill="#1e2329" stroke="#59616d"/><text x="230" y="219" font-size="23" fill="#eee" text-anchor="middle">Risoluzione</text><path d="M950,215 L600,298" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="175" width="340" height="72" rx="12" fill="#1e2329" stroke="#59616d"/><text x="970" y="219" font-size="23" fill="#eee" text-anchor="middle">Refresh</text><path d="M210,415 L600,298" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="375" width="340" height="72" rx="12" fill="#1e2329" stroke="#59616d"/><text x="230" y="419" font-size="23" fill="#eee" text-anchor="middle">Profondità colore</text><path d="M950,415 L600,298" stroke="#ff8b3d" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="375" width="340" height="72" rx="12" fill="#1e2329" stroke="#59616d"/><text x="970" y="419" font-size="23" fill="#eee" text-anchor="middle">Formato / compressione</text><rect x="450" y="255" width="300" height="85" rx="12" fill="#81451e" stroke="#59616d"/><text x="600" y="305" font-size="22" fill="#fff" text-anchor="middle">Contesto della prova</text><text x="50" y="550" font-size="20" fill="#c4cad2" text-anchor="start">Il requisito riguarda il segnale attivo e le capacità della catena.</text></g></svg>