<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Il range del Variable Refresh Rate</title><desc>LFC ripete immagini: non crea nuove simulazioni.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#ff8b3d"/></marker></defs><rect width="1200" height="600" rx="20" fill="#11151a"/><g font-family="Arial, sans-serif"><text x="50" y="48" font-size="17" fill="#ffb07a" text-anchor="start">PRIME BUILD / SCHEMA ILLUSTRATIVO ORIGINALE</text><text x="50" y="102" font-size="32" fill="#eee" text-anchor="start">Il range del Variable Refresh Rate</text><rect x="50" y="155" width="1100" height="78" rx="12" fill="#1e2329" stroke="#59616d"/><text x="75" y="190" font-size="23" fill="#ffb07a" text-anchor="start">Sotto il minimo</text><text x="380" y="190" font-size="22" fill="#eee" text-anchor="start">LFC se supportata</text><rect x="50" y="241" width="1100" height="78" rx="12" fill="#151a20" stroke="#59616d"/><text x="75" y="276" font-size="23" fill="#ffb07a" text-anchor="start">Entro il range</text><text x="380" y="276" font-size="22" fill="#eee" text-anchor="start">Refresh variabile</text><rect x="50" y="327" width="1100" height="78" rx="12" fill="#1e2329" stroke="#59616d"/><text x="75" y="362" font-size="23" fill="#ffb07a" text-anchor="start">Sopra il massimo</text><text x="380" y="362" font-size="22" fill="#eee" text-anchor="start">Dipende da sync e percorso</text><text x="50" y="550" font-size="20" fill="#c4cad2" text-anchor="start">LFC ripete immagini: non crea nuove simulazioni.</text></g></svg>