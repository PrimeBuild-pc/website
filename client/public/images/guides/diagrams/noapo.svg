<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Due riferimenti audio separati</title><desc>Profilo piatto, EQ OFF e associazione rimossa non sono equivalenti.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#ff8b3d"/></marker></defs><rect width="1200" height="600" rx="20" fill="#11151a"/><g font-family="Arial, sans-serif"><text x="50" y="48" font-size="17" fill="#ffb07a" text-anchor="start">PRIME BUILD / SCHEMA ILLUSTRATIVO ORIGINALE</text><text x="50" y="102" font-size="32" fill="#eee" text-anchor="start">Due riferimenti audio separati</text><rect x="50" y="155" width="1100" height="78" rx="12" fill="#1e2329" stroke="#59616d"/><text x="75" y="190" font-size="23" fill="#ffb07a" text-anchor="start">No APO</text><text x="380" y="190" font-size="22" fill="#eee" text-anchor="start">Equalizer APO fuori dal percorso</text><rect x="50" y="241" width="1100" height="78" rx="12" fill="#151a20" stroke="#59616d"/><text x="75" y="276" font-size="23" fill="#ffb07a" text-anchor="start">EQ consapevole</text><text x="380" y="276" font-size="22" fill="#eee" text-anchor="start">APO attivo sull’endpoint scelto</text><text x="50" y="550" font-size="20" fill="#c4cad2" text-anchor="start">Profilo piatto, EQ OFF e associazione rimossa non sono equivalenti.</text></g></svg>