<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">T568A e T568B: stessi requisiti, stessi tempi</title>
<desc id="desc">Vista del plug dall’alto, contatti dorati visibili, linguetta sotto, cavo verso chi guarda, punta lontana e pin 1 a sinistra. Pin A e B numerati con colori scritti; coppie 1–2, 3–6, 4–5, 7–8. Cavi diritti A–A o B–B. Split pair distinto dalla sola continuità.</desc>
