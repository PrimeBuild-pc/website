<text x="40" y="742" font-size="26" fill="#4ade80" text-anchor="start" font-weight="400">Cavo diritto: A–A oppure B–B. A–B = crossover classico.</text>
<text x="40" y="772" font-size="24" fill="#e5e7eb" text-anchor="start" font-weight="400">Split pair: pin continui, ma fili di coppie diverse. LED verdi non bastano.</text>
<path d="M 40 802 L 1160 802" fill="none" stroke="#8896a7" stroke-width="3"/>
<text x="40" y="838" font-size="24" fill="#b5c0ce" text-anchor="start" font-weight="400">A e B hanno la stessa prestazione: cambia il codice colori, non la latenza.</text>
<text x="40" y="870" font-size="24" fill="#b5c0ce" text-anchor="start" font-weight="400">Coppie elettriche: 1–2 / 3–6 / 4–5 / 7–8; 3–6 non sono pin adiacenti.</text>
